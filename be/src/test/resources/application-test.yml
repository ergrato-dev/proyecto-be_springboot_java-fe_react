# Configuración de tests de integración
# ¿Para qué? Sobreescribir la configuración base para tests — apunta a la BD
#            exclusiva de pruebas (servicio db-test, BD nn_auth_test).
# ¿Impacto? Los tests nunca tocan el servidor de desarrollo (nn_auth_db) y
#           @Transactional garantiza rollback automático entre tests para
#           evitar contaminación de datos. Requiere: docker compose up -d --wait db-test.

spring:
  # BD exclusiva para tests: servicio db-test del docker-compose.yml (puerto 5433).
  # ¿Por qué no Testcontainers? Docker Desktop en Linux no expone el daemon
  # con la API completa que Testcontainers requiere para iniciar contenedores.
  # ¿Por qué una variable? La URL (con el usuario y la clave de la BD desechable)
  # llega por TEST_DATABASE_URL, nunca escrita en este archivo. Sin la variable,
  # el contexto no arranca y los tests se detienen antes de conectarse a nada:
  #   TEST_DATABASE_URL=jdbc:postgresql://localhost:5433/nn_auth_test?user=nn_user&password=nn_password
  datasource:
    url: ${TEST_DATABASE_URL}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Email apunta a un host falso — los tests mockean EmailService
  mail:
    host: localhost
    port: 1025
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Variables de la app para tests
app:
  jwt:
    secret: test-secret-key-minimum-32-chars-for-hmac-sha256
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
  # Deshabilitado en tests — AuthControllerTest dispara muchas más peticiones
  # por IP que el límite real en una sola clase de test (mismo patrón que el
  # skip por NODE_ENV=test en el repo Express).
  rate-limit:
    enabled: false
    capacity: 10
    refill-minutes: 15
  frontend-url: http://localhost:5173
  environment: test

# Swagger deshabilitado en tests
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# Logging mínimo en tests — reducir ruido
logging:
  level:
    com.nn.auth: DEBUG
    org.springframework.security: WARN
    com.zaxxer.hikari: WARN
    org.flywaydb: INFO
